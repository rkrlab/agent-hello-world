name: PONS price monitor

on:
  workflow_dispatch:
    inputs:
      force_alert:
        description: Force a test alert
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - agent.py
      - .github/workflows/pons-monitor.yml

permissions:
  contents: read
  issues: write

jobs:
  check-pons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PONS price
        id: pons
        env:
          PONS_ALERT_ABOVE_USD: ${{ vars.PONS_ALERT_ABOVE_USD || '1' }}
          FORCE_ALERT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_alert) }}
        run: python3 agent.py

      - name: Check for an existing alert
        if: steps.pons.outputs.should_alert == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh issue list --state open --search 'PONS price alert in:title' --json number --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create GitHub issue alert
        if: steps.pons.outputs.should_alert == 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PRICE: ${{ steps.pons.outputs.price }}
          THRESHOLD: ${{ steps.pons.outputs.threshold }}
          FORCED: ${{ steps.pons.outputs.forced }}
        run: |
          gh issue create \
            --title "PONS price alert" \
            --body "PONS is currently **\$${PRICE} USD**.

          Configured threshold: **\$${THRESHOLD} USD**
          Forced test alert: **${FORCED}**
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
