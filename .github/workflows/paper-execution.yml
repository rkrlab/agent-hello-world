name: Crypto paper execution

on:
  workflow_dispatch:
    inputs:
      signal_file:
        description: Path to a committed signal JSON
        required: true
        default: signals/current.json
        type: string
  push:
    branches: [main]
    paths:
      - signals/**.json

permissions:
  contents: read
  issues: write

jobs:
  paper-execute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve signal file
        id: signal
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            signal="${{ inputs.signal_file }}"
          else
            signal="$(ls -1t signals/*.json 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$signal" ] || [ ! -f "$signal" ]; then
            echo "No committed signal JSON found; nothing to execute."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "signal=$signal" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deterministic paper execution record
        if: steps.signal.outputs.skip != 'true'
        id: paper
        env:
          SIGNAL_FILE: ${{ steps.signal.outputs.signal }}
        run: python3 paper_executor.py

      - name: Create immutable paper execution issue
        if: steps.signal.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.paper.outputs.asset }}
          EXECUTABLE: ${{ steps.paper.outputs.executable }}
          FILL: ${{ steps.paper.outputs.fill }}
          ALLOCATION: ${{ steps.paper.outputs.allocation }}
          RECORD: ${{ steps.paper.outputs.record }}
        run: |
          if [ "$EXECUTABLE" = "true" ]; then
            status="EXECUTED"
          else
            status="REJECTED"
          fi

          cat > /tmp/body.md <<EOF
          ## Paper execution: ${status}

          This is a **simulation only**. No wallet, exchange, DEX, or real funds were accessed.

          - Asset: **${ASSET}**
          - Simulated fill: **\$${FILL}**
          - Allowed paper allocation: **\$${ALLOCATION}**
          - Result: **${status}**
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ### Frozen execution record

          \`\`\`json
          ${RECORD}
          \`\`\`

          Future evaluation should apply the frozen rules in this record without retroactive changes.
          EOF

          gh issue create \
            --title "Paper execution ${status}: ${ASSET}" \
            --body-file /tmp/body.md
